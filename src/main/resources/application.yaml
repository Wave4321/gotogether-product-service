spring:
  datasource:
    url: jdbc:h2:mem:gotogether;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate.format_sql: true
      hibernate.default_batch_fetch_size: 100
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080